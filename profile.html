<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tuition Media - Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding-bottom: 70px; }
        
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: white; display: flex; justify-content: space-around;
            padding: 10px 0; box-shadow: 0 -2px 15px rgba(0,0,0,0.1);
            z-index: 1000; border-top: 1px solid #e0e0e0;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            gap: 5px; padding: 5px 15px; border-radius: 10px;
            text-decoration: none; color: #666;
        }
        .nav-item.active { color: #667eea; }
        .nav-icon { font-size: 24px; }
        .nav-label { font-size: 12px; font-weight: 500; }
        
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        
        .card {
            background: white; border-radius: 20px; padding: 25px;
            margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .profile-header { display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; }
        .profile-image-container { position: relative; margin-bottom: 15px; }
        .profile-image { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 4px solid #667eea; }
        .edit-photo-btn {
            position: absolute; bottom: 5px; right: 5px; background: #667eea; color: white;
            border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer;
            font-size: 18px; transition: all 0.3s;
        }
        .profile-name { font-size: 28px; font-weight: bold; color: #333; }
        .profile-role { color: #667eea; margin: 5px 0; font-size: 16px; }
        
        .btn {
            padding: 12px 24px; border: none; border-radius: 10px;
            cursor: pointer; font-size: 14px; font-weight: 600;
            transition: all 0.3s; display: inline-flex; align-items: center; gap: 8px;
        }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-outline { background: transparent; border: 2px solid #667eea; color: #667eea; }
        .btn-danger { background: #ff4757; color: white; }
        .btn-success { background: #28a745; color: white; }
        
        .info-grid { display: grid; gap: 15px; margin-top: 20px; }
        .info-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #f8f9fa; border-radius: 10px; flex-wrap: wrap; gap: 10px; }
        .info-label { font-weight: 600; color: #666; min-width: 120px; }
        .info-value { color: #333; flex: 1; }
        .info-edit-btn { background: none; border: none; color: #667eea; cursor: pointer; font-size: 16px; padding: 5px 10px; border-radius: 5px; }
        
        .badge { display: inline-block; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; margin: 3px; }
        .badge-success { background: #d4edda; color: #155724; }
        
        .subjects-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .subject-tag { background: #e3f2fd; color: #1976d2; padding: 5px 12px; border-radius: 20px; font-size: 13px; display: inline-flex; align-items: center; gap: 8px; }
        .subject-tag button { background: none; border: none; color: #1976d2; cursor: pointer; }
        .add-subject { background: #f0f0f0; border: 1px dashed #ccc; cursor: pointer; }
        
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: center;
        }
        .modal-content {
            background: white; border-radius: 20px; padding: 25px;
            max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px;
        }
        
        .button-group { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .admin-panel { background: #fff3cd; padding: 15px; border-radius: 10px; margin-top: 20px; }
        .admin-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
        .stat-box { background: white; padding: 10px; border-radius: 8px; text-align: center; }
        
        .auth-tabs { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 2px solid #e0e0e0; }
        .auth-tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; background: none; border: none; font-size: 16px; font-weight: 600; color: #666; }
        .auth-tab.active { color: #667eea; border-bottom: 2px solid #667eea; }
        
        .alert { padding: 12px; border-radius: 10px; margin-bottom: 20px; display: none; }
        .alert-success { background: #d4edda; color: #155724; }
        .alert-error { background: #f8d7da; color: #721c24; }
        
        @media (max-width: 768px) { .container { padding: 10px; } .info-row { flex-direction: column; align-items: flex-start; } .button-group { flex-direction: column; } .btn { width: 100%; justify-content: center; } }
    </style>
</head>
<body>
    <div class="bottom-nav">
        <a href="index.html" class="nav-item"><div class="nav-icon">🏠</div><div class="nav-label">Home</div></a>
        <a href="find-tutors.html" class="nav-item"><div class="nav-icon">🔍</div><div class="nav-label">Find Tutors</div></a>
        <a href="tuition-jobs.html" class="nav-item"><div class="nav-icon">💼</div><div class="nav-label">Tuition Jobs</div></a>
        <a href="profile.html" class="nav-item active"><div class="nav-icon">👤</div><div class="nav-label">Profile</div></a>
    </div>

    <div class="container" id="profileContainer"></div>

    <!-- Auth Modal -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <div class="modal-header" style="display:flex; justify-content:space-between; margin-bottom:20px;">
                <h2 id="authTitle">Welcome Back!</h2>
                <span class="close" onclick="closeAuthModal()" style="cursor:pointer; font-size:24px;">&times;</span>
            </div>
            <div id="alertMessage" class="alert"></div>
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchAuthTab('login')">Login</button>
                <button class="auth-tab" onclick="switchAuthTab('register')">Register</button>
            </div>
            <div id="loginForm">
                <div class="form-group"><label>Email</label><input type="email" id="loginEmail" placeholder="Enter your email"></div>
                <div class="form-group"><label>Password</label><input type="password" id="loginPassword" placeholder="Enter your password"></div>
                <button class="btn btn-primary" style="width:100%" onclick="login()">Login</button>
                <p style="text-align:center; margin-top:15px; color:#666;">Demo: admin@tuition.com / admin123</p>
            </div>
            <div id="registerForm" style="display:none;">
                <div class="form-group"><label>Full Name</label><input type="text" id="regName"></div>
                <div class="form-group"><label>Email</label><input type="email" id="regEmail"></div>
                <div class="form-group"><label>Phone</label><input type="tel" id="regPhone"></div>
                <div class="form-group"><label>Role</label><select id="regRole"><option value="student">Student</option><option value="tutor">Tutor</option></select></div>
                <div class="form-group"><label>Password</label><input type="password" id="regPassword"></div>
                <div class="form-group"><label>Confirm Password</label><input type="password" id="regConfirmPassword"></div>
                <button class="btn btn-primary" style="width:100%" onclick="register()">Register</button>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content"><h2 style="margin-bottom:20px;">✏️ Edit Profile</h2>
            <form id="editForm"><div class="form-group"><label>Full Name</label><input type="text" id="editName" required></div>
            <div class="form-group"><label>Phone</label><input type="tel" id="editPhone" required></div>
            <div class="form-group"><label>Email</label><input type="email" id="editEmail" required></div>
            <div class="form-group"><label>Address/Area</label><input type="text" id="editAddress"></div>
            <div id="editStudentFields" style="display:none;"><div class="form-group"><label>Class</label><select id="editClass"><option>Class 1-5</option><option>Class 6-8</option><option>Class 9-10</option><option>HSC</option><option>University</option></select></div>
            <div class="form-group"><label>Subjects</label><input type="text" id="editSubjects"></div></div>
            <div id="editTutorFields" style="display:none;"><div class="form-group"><label>Qualification</label><textarea id="editQualification" rows="4"></textarea></div>
            <div class="form-group"><label>Experience</label><input type="text" id="editExperience"></div></div>
            <div class="button-group"><button type="submit" class="btn btn-primary">Save</button><button type="button" class="btn btn-outline" onclick="closeEditModal()">Cancel</button></div></form>
        </div>
    </div>

    <!-- Photo Modal -->
    <div id="photoModal" class="modal">
        <div class="modal-content"><h2 style="margin-bottom:20px;">📸 Update Photo</h2>
            <div class="form-group"><label>Photo URL</label><input type="text" id="photoUrl" placeholder="Enter image URL"></div>
            <div class="button-group"><button class="btn btn-primary" onclick="updatePhoto()">Update</button><button class="btn btn-outline" onclick="closePhotoModal()">Cancel</button></div>
        </div>
    </div>

    <!-- Subject Modal -->
    <div id="subjectModal" class="modal">
        <div class="modal-content"><h2 style="margin-bottom:20px;">➕ Add Subject</h2>
            <div class="form-group"><label>Subject Name</label><input type="text" id="newSubject"></div>
            <div class="button-group"><button class="btn btn-primary" onclick="addNewSubject()">Add</button><button class="btn btn-outline" onclick="closeSubjectModal()">Cancel</button></div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let users = [];
        let tuitionJobs = [];
        
        function loadUsers() {
            const saved = localStorage.getItem('tuition_users');
            if(saved) { users = JSON.parse(saved); }
            else {
                users = [
                    { id:1, name:"Admin", email:"admin@tuition.com", phone:"88017091303712", password:"admin123", role:"admin", profilePhoto:"https://randomuser.me/api/portraits/men/99.jpg" },
                    { id:2, name:"শাহিদুল ইসলাম", email:"tutor@example.com", phone:"01712345678", password:"123456", role:"tutor", profilePhoto:"https://randomuser.me/api/portraits/men/1.jpg", qualification:"M.Sc in Mathematics, DU\n৫ বছর অভিজ্ঞতা", subjects:["Mathematics","Physics"], area:"ধানমন্ডি", experience:"৫ বছর", rating:4.8 }
                ];
                saveUsers();
            }
        }
        
        function saveUsers() { localStorage.setItem('tuition_users', JSON.stringify(users)); }
        
        function loadJobs() {
            const saved = localStorage.getItem('tuition_jobs');
            if(saved) { tuitionJobs = JSON.parse(saved); }
            else { tuitionJobs = []; }
        }
        
        function checkLogin() {
            const saved = localStorage.getItem('currentUser');
            if(saved) currentUser = JSON.parse(saved);
        }
        
        function saveCurrentUser(user) { localStorage.setItem('currentUser', JSON.stringify(user)); currentUser = user; }
        function clearCurrentUser() { localStorage.removeItem('currentUser'); currentUser = null; }
        
        function showAlert(msg, type) {
            const alertDiv = document.getElementById('alertMessage');
            alertDiv.textContent = msg;
            alertDiv.className = `alert alert-${type}`;
            alertDiv.style.display = 'block';
            setTimeout(() => alertDiv.style.display = 'none', 3000);
        }
        
        function openAuthModal() { document.getElementById('authModal').style.display = 'flex'; }
        function closeAuthModal() { document.getElementById('authModal').style.display = 'none'; }
        
        function switchAuthTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const tabs = document.querySelectorAll('.auth-tab');
            if(tab === 'login') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                tabs[0].classList.add('active');
                tabs[1].classList.remove('active');
                document.getElementById('authTitle').textContent = 'Welcome Back!';
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                tabs[0].classList.remove('active');
                tabs[1].classList.add('active');
                document.getElementById('authTitle').textContent = 'Create New Account';
            }
        }
        
        function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const user = users.find(u => u.email === email && u.password === password);
            if(user) {
                saveCurrentUser(user);
                closeAuthModal();
                renderProfile();
                showAlert(`Welcome ${user.name}!`, 'success');
            } else { showAlert('Invalid email or password', 'error'); }
        }
        
        function register() {
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const phone = document.getElementById('regPhone').value;
            const role = document.getElementById('regRole').value;
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirmPassword').value;
            if(!name || !email || !phone || !password) { showAlert('Fill all fields', 'error'); return; }
            if(password !== confirm) { showAlert('Passwords do not match', 'error'); return; }
            if(users.find(u => u.email === email)) { showAlert('Email already exists', 'error'); return; }
            const newUser = { id:Date.now(), name, email, phone, password, role, profilePhoto:'https://via.placeholder.com/150' };
            users.push(newUser);
            saveUsers();
            saveCurrentUser(newUser);
            closeAuthModal();
            renderProfile();
            showAlert('Registration successful!', 'success');
        }
        
        function renderProfile() {
            const container = document.getElementById('profileContainer');
            if(!currentUser) {
                container.innerHTML = `<div class="card" style="text-align:center;"><i class="fas fa-lock" style="font-size:60px; color:#667eea;"></i><h2>Please Login</h2><button class="btn btn-primary" onclick="openAuthModal()">Login / Register</button></div>`;
                return;
            }
            if(currentUser.role === 'admin') renderAdmin();
            else if(currentUser.role === 'tutor') renderTutor();
            else renderStudent();
        }
        
        function renderAdmin() {
            const tutorCount = users.filter(u => u.role === 'tutor').length;
            const studentCount = users.filter(u => u.role === 'student').length;
            document.getElementById('profileContainer').innerHTML = `
                <div class="card"><div class="profile-header"><div class="profile-image-container"><img src="${currentUser.profilePhoto}" class="profile-image"><button class="edit-photo-btn" onclick="openPhotoModal()"><i class="fas fa-camera"></i></button></div>
                <div class="profile-name">${currentUser.name}</div><div class="profile-role"><i class="fas fa-shield-alt"></i> Administrator</div></div>
                <div class="info-grid"><div class="info-row"><span class="info-label">Email:</span><span class="info-value">${currentUser.email}</span><button class="info-edit-btn" onclick="openEditModal()"><i class="fas fa-edit"></i></button></div>
                <div class="info-row"><span class="info-label">Phone:</span><span class="info-value">${currentUser.phone}</span><button class="info-edit-btn" onclick="openEditModal()"><i class="fas fa-edit"></i></button></div></div>
                <div class="admin-panel"><h3><i class="fas fa-chart-line"></i> Admin Dashboard</h3>
                <div class="admin-stats"><div class="stat-box"><h3>${users.length}</h3><p>Total Users</p></div>
                <div class="stat-box"><h3>${tutorCount}</h3><p>Tutors</p></div>
                <div class="stat-box"><h3>${studentCount}</h3><p>Students</p></div>
                <div class="stat-box"><h3>${tuitionJobs.length}</h3><p>Jobs</p></div></div>
                <button class="btn btn-primary" style="margin-top:10px;" onclick="window.location.href='tuition-jobs.html'">Manage Jobs</button>
                <button class="btn btn-outline" style="margin-top:10px;" onclick="window.location.href='find-tutors.html'">Manage Tutors</button></div>
                <div class="button-group"><button class="btn btn-danger" onclick="logout()">Logout</button></div></div>`;
        }
        
        function renderTutor() {
            const subjects = currentUser.subjects || [];
            document.getElementById('profileContainer').innerHTML = `
                <div class="card"><div class="profile-header"><div class="profile-image-container"><img src="${currentUser.profilePhoto}" class="profile-image"><button class="edit-photo-btn" onclick="openPhotoModal()"><i class="fas fa-camera"></i></button></div>
                <div class="profile-name">${currentUser.name}</div><div class="profile-role"><i class="fas fa-chalkboard-teacher"></i> Professional Tutor</div><div>⭐ ${currentUser.rating || '4.5'} (${currentUser.experience || '0'} years)</div></div>
                <div class="info-grid"><div class="info-row"><span class="info-label">Email:</span><span class="info-value">${currentUser.email}</span><button class="info-edit-btn" onclick="openEditModal()"><i class="fas fa-edit"></i></button></div>
                <div class="info-row"><span class="info-label">Phone:</span><span class="info-value">${currentUser.phone}</span><button class="info-edit-btn" onclick="openEditModal()"><i class="fas fa-edit"></i></button></div>
                <div class="info-row"><span class="info-label">Area:</span><span class="info-value">${currentUser.area || 'Not provided'}</span><button class="info-edit-btn" onclick="openEditModal()"><i class="fas fa-edit"></i></button></div></div>
                <div><h3>Qualification</h3><div style="padding:15px; background:#f8f9fa; border-radius:10px;">${currentUser.qualification || 'Not added'}</div><button class="btn btn-outline" style="margin-top:10px;" onclick="openEditModal()">Edit</button></div>
                <div style="margin-top:20px;"><h3>Teaching Subjects</h3><div class="subjects-container">${subjects.map(s => `<span class="subject-tag">${s}<button onclick="removeSubject('${s}')"><i class="fas fa-times"></i></button></span>`).join('')}<span class="subject-tag add-subject" onclick="openSubjectModal()"><i class="fas fa-plus"></i> Add</span></div></div>
                <div class="button-group"><button class="btn btn-danger" onclick="logout()">Logout</button></div></div>`;
        }
        
        function renderStudent() {
            document.getElementById('profileContainer').innerHTML = `
                <div class="card"><div class="profile-header"><div class="profile-image-container"><img src="${currentUser.profilePhoto}" class="profile-image"><button class="edit-photo-btn" onclick="openPhotoModal()"><i class="fas fa-camera"></i></button></div>
                <div class="profile-name">${currentUser.name}</div><div class="profile-role"><i class="fas fa-user-graduate"></i> Student / Parent</div></div>
                <div class="info-grid"><div class="info-row"><span class="info-label">Email:</span><span class="info-value">${currentUser.email}</span><button class="info-edit-btn" onclick="openEditModal()"><i class="fas fa-edit"></i></button></div>
                <div class="info-row"><span class="info-label">Phone:</span><span class="info-value">${currentUser.phone}</span><button class="info-edit-btn" onclick="openEditModal()"><i class="fas fa-edit"></i></button></div>
                <div class="info-row"><span class="info-label">Class:</span><span class="info-value">${currentUser.class || 'Not specified'}</span><button class="info-edit-btn" onclick="openEditModal()"><i class="fas fa-edit"></i></button></div>
                <div class="info-row"><span class="info-label">Subjects:</span><span class="info-value">${currentUser.subjects || 'Not specified'}</span><button class="info-edit-btn" onclick="openEditModal()"><i class="fas fa-edit"></i></button></div></div>
                <div class="button-group"><button class="btn btn-danger" onclick="logout()">Logout</button></div></div>`;
        }
        
        function openEditModal() {
            document.getElementById('editName').value = currentUser.name || '';
            document.getElementById('editPhone').value = currentUser.phone || '';
            document.getElementById('editEmail').value = currentUser.email || '';
            document.getElementById('editAddress').value = currentUser.area || '';
            if(currentUser.role === 'student') {
                document.getElementById('editStudentFields').style.display = 'block';
                document.getElementById('editTutorFields').style.display = 'none';
                document.getElementById('editClass').value = currentUser.class || 'Class 1-5';
                document.getElementById('editSubjects').value = currentUser.subjects || '';
            } else if(currentUser.role === 'tutor') {
                document.getElementById('editStudentFields').style.display = 'none';
                document.getElementById('editTutorFields').style.display = 'block';
                document.getElementById('editQualification').value = currentUser.qualification || '';
                document.getElementById('editExperience').value = currentUser.experience || '';
            }
            document.getElementById('editModal').style.display = 'flex';
        }
        function closeEditModal() { document.getElementById('editModal').style.display = 'none'; }
        
        document.getElementById('editForm')?.addEventListener('submit', function(e) {
            e.preventDefault();
            currentUser.name = document.getElementById('editName').value;
            currentUser.phone = document.getElementById('editPhone').value;
            currentUser.email = document.getElementById('editEmail').value;
            currentUser.area = document.getElementById('editAddress').value;
            if(currentUser.role === 'student') {
                currentUser.class = document.getElementById('editClass').value;
                currentUser.subjects = document.getElementById('editSubjects').value;
            } else if(currentUser.role === 'tutor') {
                currentUser.qualification = document.getElementById('editQualification').value;
                currentUser.experience = document.getElementById('editExperience').value;
            }
            const index = users.findIndex(u => u.id === currentUser.id);
            if(index !== -1) users[index] = currentUser;
            saveUsers();
            saveCurrentUser(currentUser);
            closeEditModal();
            renderProfile();
            showAlert('Profile updated!', 'success');
        });
        
        function openPhotoModal() { document.getElementById('photoModal').style.display = 'flex'; }
        function closePhotoModal() { document.getElementById('photoModal').style.display = 'none'; }
        function updatePhoto() {
            const url = document.getElementById('photoUrl').value;
            if(url) {
                currentUser.profilePhoto = url;
                const index = users.findIndex(u => u.id === currentUser.id);
                if(index !== -1) users[index] = currentUser;
                saveUsers();
                saveCurrentUser(currentUser);
                closePhotoModal();
                renderProfile();
                showAlert('Photo updated!', 'success');
            }
        }
        
        function openSubjectModal() { document.getElementById('subjectModal').style.display = 'flex'; }
        function closeSubjectModal() { document.getElementById('subjectModal').style.display = 'none'; document.getElementById('newSubject').value = ''; }
        function addNewSubject() {
            const subject = document.getElementById('newSubject').value.trim();
            if(subject) {
                if(!currentUser.subjects) currentUser.subjects = [];
                if(!currentUser.subjects.includes(subject)) {
                    currentUser.subjects.push(subject);
                    const index = users.findIndex(u => u.id === currentUser.id);
                    if(index !== -1) users[index] = currentUser;
                    saveUsers();
                    saveCurrentUser(currentUser);
                    closeSubjectModal();
                    renderProfile();
                    showAlert(`Subject "${subject}" added!`, 'success');
                } else { showAlert('Subject already exists', 'error'); }
            }
        }
        function removeSubject(subject) {
            currentUser.subjects = currentUser.subjects.filter(s => s !== subject);
            const index = users.findIndex(u => u.id === currentUser.id);
            if(index !== -1) users[index] = currentUser;
            saveUsers();
            saveCurrentUser(currentUser);
            renderProfile();
        }
        
        function logout() { clearCurrentUser(); renderProfile(); showAlert('Logged out!', 'success'); }
        
        window.onclick = function(e) { if(e.target.classList.contains('modal')) e.target.style.display = 'none'; }
        
        loadUsers();
        loadJobs();
        checkLogin();
        renderProfile();
    </script>
</body>
</html>
