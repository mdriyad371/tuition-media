<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tuition Media - My Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 80px;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 0;
            box-shadow: 0 -2px 15px rgba(0,0,0,0.1);
            z-index: 1000;
            border-top: 1px solid #e0e0e0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding: 5px 15px;
            border-radius: 10px;
            text-decoration: none;
            color: #666;
            transition: all 0.3s;
        }

        .nav-item.active {
            color: #667eea;
        }

        .nav-icon { font-size: 24px; }
        .nav-label { font-size: 12px; font-weight: 500; }

        /* Container */
        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Cards */
        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        /* Profile Header */
        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
        }

        .profile-image-container {
            position: relative;
            margin-bottom: 15px;
        }

        .profile-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #667eea;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .edit-photo-btn {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s;
        }

        .edit-photo-btn:hover {
            background: #764ba2;
            transform: scale(1.1);
        }

        .profile-name {
            font-size: 28px;
            font-weight: bold;
            color: #333;
        }

        .profile-role {
            color: #667eea;
            margin: 5px 0;
            font-size: 16px;
            font-weight: 500;
        }

        .rating {
            color: #ffc107;
            margin-top: 5px;
        }

        /* Buttons */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #667eea;
            color: #667eea;
        }

        .btn-outline:hover {
            background: #667eea;
            color: white;
        }

        .btn-danger {
            background: #ff4757;
            color: white;
        }

        .btn-danger:hover {
            background: #ff3838;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        /* Info Grid */
        .info-grid {
            display: grid;
            gap: 15px;
            margin-top: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .info-label {
            font-weight: 600;
            color: #666;
            min-width: 120px;
        }

        .info-value {
            color: #333;
            flex: 1;
        }

        .info-edit-btn {
            background: none;
            border: none;
            color: #667eea;
            cursor: pointer;
            font-size: 16px;
            padding: 5px 10px;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .info-edit-btn:hover {
            background: #e0e0e0;
        }

        /* Badges */
        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin: 3px;
        }

        .badge-success {
            background: #d4edda;
            color: #155724;
        }

        .badge-info {
            background: #d1ecf1;
            color: #0c5460;
        }

        .badge-warning {
            background: #fff3cd;
            color: #856404;
        }

        /* Subjects Container */
        .subjects-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .subject-tag {
            background: #e3f2fd;
            color: #1976d2;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .subject-tag button {
            background: none;
            border: none;
            color: #1976d2;
            cursor: pointer;
            font-size: 12px;
        }

        .add-subject {
            background: #f0f0f0;
            border: 1px dashed #ccc;
            cursor: pointer;
        }

        .add-subject:hover {
            background: #e0e0e0;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 25px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: #333;
            font-size: 22px;
        }

        .close {
            cursor: pointer;
            font-size: 24px;
            color: #999;
            transition: all 0.3s;
        }

        .close:hover {
            color: #333;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        /* Button Group */
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        /* Admin Panel */
        .admin-panel {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin-top: 20px;
            border-radius: 10px;
        }

        /* Login Required */
        .login-required {
            text-align: center;
            padding: 40px;
        }

        /* Tabs */
        .auth-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 2px solid #e0e0e0;
        }

        .auth-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
        }

        .auth-tab.active {
            color: #667eea;
            border-bottom: 2px solid #667eea;
        }

        /* Alert */
        .alert {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding: 10px;
                padding-bottom: 70px;
            }

            .info-row {
                flex-direction: column;
                align-items: flex-start;
            }

            .info-label {
                min-width: auto;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item">
            <div class="nav-icon">🏠</div>
            <div class="nav-label">Home</div>
        </a>
        <a href="find-tutors.html" class="nav-item">
            <div class="nav-icon">🔍</div>
            <div class="nav-label">Find Tutors</div>
        </a>
        <a href="tuition-jobs.html" class="nav-item">
            <div class="nav-icon">💼</div>
            <div class="nav-label">Tuition Jobs</div>
        </a>
        <a href="profile.html" class="nav-item active">
            <div class="nav-icon">👤</div>
            <div class="nav-label">Profile</div>
        </a>
    </div>

    <div class="container" id="profileContainer"></div>

    <!-- Login/Register Modal -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="authTitle">Welcome Back!</h2>
                <span class="close" onclick="closeAuthModal()">&times;</span>
            </div>
            
            <div id="alertMessage" class="alert"></div>
            
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchAuthTab('login')">Login</button>
                <button class="auth-tab" onclick="switchAuthTab('register')">Register</button>
            </div>

            <!-- Login Form -->
            <div id="loginForm">
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="email" id="loginEmail" placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password">
                </div>
                <button class="btn btn-primary" style="width: 100%;" onclick="login()">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
                <p style="text-align: center; margin-top: 15px; color: #666;">
                    Demo: tutor@example.com / any password
                </p>
            </div>

            <!-- Register Form -->
            <div id="registerForm" style="display: none;">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Full Name</label>
                    <input type="text" id="regName" placeholder="Enter your full name">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="email" id="regEmail" placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-phone"></i> Phone Number</label>
                    <input type="tel" id="regPhone" placeholder="Enter your phone number">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-user-tag"></i> I am a</label>
                    <select id="regRole">
                        <option value="student">Student / Parent (Looking for tutor)</option>
                        <option value="tutor">Tutor (Looking for tuition job)</option>
                    </select>
                </div>
                <div class="form-group" id="tutorQualField" style="display: none;">
                    <label><i class="fas fa-graduation-cap"></i> Qualification</label>
                    <textarea id="regQualification" rows="3" placeholder="e.g., B.Sc in Mathematics, DU, 5 years teaching experience"></textarea>
                </div>
                <div class="form-group" id="tutorExpField" style="display: none;">
                    <label><i class="fas fa-clock"></i> Experience</label>
                    <input type="text" id="regExperience" placeholder="e.g., 5 years">
                </div>
                <div class="form-group" id="studentClassField" style="display: none;">
                    <label><i class="fas fa-chalkboard"></i> Current Class</label>
                    <select id="regClass">
                        <option>Class 1-5</option>
                        <option>Class 6-8</option>
                        <option>Class 9-10</option>
                        <option>HSC</option>
                        <option>University</option>
                        <option>Parent</option>
                    </select>
                </div>
                <div class="form-group" id="studentSubjectField" style="display: none;">
                    <label><i class="fas fa-book"></i> Subjects Needing Help</label>
                    <input type="text" id="regSubjects" placeholder="e.g., Mathematics, Physics, English">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="regPassword" placeholder="Create a password">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Confirm Password</label>
                    <input type="password" id="regConfirmPassword" placeholder="Confirm your password">
                </div>
                <button class="btn btn-primary" style="width: 100%;" onclick="register()">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </div>
        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-edit"></i> Edit Profile</h2>
                <span class="close" onclick="closeEditModal()">&times;</span>
            </div>
            <form id="editForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="editName" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="editPhone" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="editEmail" required>
                </div>
                <div class="form-group">
                    <label>Address / Area</label>
                    <input type="text" id="editAddress" placeholder="e.g., Dhanmondi, Dhaka">
                </div>
                <div id="editStudentFields" style="display: none;">
                    <div class="form-group">
                        <label>Class</label>
                        <select id="editClass">
                            <option>Class 1-5</option>
                            <option>Class 6-8</option>
                            <option>Class 9-10</option>
                            <option>HSC</option>
                            <option>University</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Subjects</label>
                        <input type="text" id="editSubjects" placeholder="e.g., Math, Physics">
                    </div>
                </div>
                <div id="editTutorFields" style="display: none;">
                    <div class="form-group">
                        <label>Qualification</label>
                        <textarea id="editQualification" rows="4" placeholder="Your educational qualification"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Experience</label>
                        <input type="text" id="editExperience" placeholder="e.g., 5 years">
                    </div>
                </div>
                <div class="button-group">
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Changes</button>
                    <button type="button" class="btn btn-outline" onclick="closeEditModal()"><i class="fas fa-times"></i> Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Photo Modal -->
    <div id="photoModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-camera"></i> Update Profile Photo</h2>
                <span class="close" onclick="closePhotoModal()">&times;</span>
            </div>
            <div class="form-group">
                <label>Photo URL</label>
                <input type="text" id="photoUrl" placeholder="Enter image URL">
                <small style="color: #666; display: block; margin-top: 5px;">Use any image URL from the internet</small>
            </div>
            <div class="form-group">
                <label>Choose Default Avatar</label>
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <button type="button" class="btn btn-outline" onclick="setPhoto('https://randomuser.me/api/portraits/men/1.jpg')">👨 Male 1</button>
                    <button type="button" class="btn btn-outline" onclick="setPhoto('https://randomuser.me/api/portraits/women/2.jpg')">👩 Female 1</button>
                    <button type="button" class="btn btn-outline" onclick="setPhoto('https://randomuser.me/api/portraits/men/3.jpg')">👨 Male 2</button>
                    <button type="button" class="btn btn-outline" onclick="setPhoto('https://randomuser.me/api/portraits/women/4.jpg')">👩 Female 2</button>
                </div>
            </div>
            <div class="button-group">
                <button class="btn btn-primary" onclick="updatePhoto()"><i class="fas fa-check"></i> Update Photo</button>
                <button class="btn btn-outline" onclick="closePhotoModal()"><i class="fas fa-times"></i> Cancel</button>
            </div>
        </div>
    </div>

    <!-- Add Subject Modal -->
    <div id="subjectModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-plus"></i> Add Subject</h2>
                <span class="close" onclick="closeSubjectModal()">&times;</span>
            </div>
            <div class="form-group">
                <label>Subject Name</label>
                <input type="text" id="newSubject" placeholder="e.g., Mathematics, Physics, English">
            </div>
            <div class="button-group">
                <button class="btn btn-primary" onclick="addNewSubject()"><i class="fas fa-plus"></i> Add Subject</button>
                <button class="btn btn-outline" onclick="closeSubjectModal()"><i class="fas fa-times"></i> Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // Database (localStorage)
        let currentUser = null;
        let users = [];
        let tuitionJobs = [];

        // Initialize
        function init() {
            loadUsers();
            loadJobs();
            checkLoginStatus();
            renderProfile();
            
            // Role select change handler
            document.getElementById('regRole')?.addEventListener('change', function(e) {
                const isTutor = e.target.value === 'tutor';
                document.getElementById('tutorQualField').style.display = isTutor ? 'block' : 'none';
                document.getElementById('tutorExpField').style.display = isTutor ? 'block' : 'none';
                document.getElementById('studentClassField').style.display = isTutor ? 'none' : 'block';
                document.getElementById('studentSubjectField').style.display = isTutor ? 'none' : 'block';
            });
        }

        // Load users from localStorage
        function loadUsers() {
            const saved = localStorage.getItem('tuition_users');
            if (saved) {
                users = JSON.parse(saved);
            } else {
                // Demo users
                users = [
                    {
                        id: 1,
                        name: "শাহিদুল ইসলাম",
                        email: "tutor@example.com",
                        phone: "01712345678",
                        password: "123456",
                        role: "tutor",
                        profilePhoto: "https://randomuser.me/api/portraits/men/1.jpg",
                        qualification: "M.Sc in Mathematics, ঢাকা বিশ্ববিদ্যালয়\n৫ বছর শিক্ষকতা অভিজ্ঞতা\nউচ্চতর গণিত ও পদার্থবিজ্ঞানে বিশেষজ্ঞ",
                        subjects: ["Mathematics", "Physics", "Higher Math"],
                        area: "ধানমন্ডি, ঢাকা",
                        experience: "৫ বছর",
                        rating: 4.8
                    },
                    {
                        id: 2,
                        name: "ফাতেমা বেগম",
                        email: "fatema@example.com",
                        phone: "01812345678",
                        password: "123456",
                        role: "tutor",
                        profilePhoto: "https://randomuser.me/api/portraits/women/2.jpg",
                        qualification: "B.A in English, জাহাঙ্গীরনগর বিশ্ববিদ্যালয়\n৩ বছর শিক্ষকতা অভিজ্ঞতা\nIELTS 8.0",
                        subjects: ["English", "Literature"],
                        area: "গুলশান, ঢাকা",
                        experience: "৩ বছর",
                        rating: 4.5
                    },
                    {
                        id: 3,
                        name: "Admin Rahman",
                        email: "admin@tuition.com",
                        phone: "88017091303712",
                        password: "admin123",
                        role: "admin",
                        profilePhoto: "https://randomuser.me/api/portraits/men/99.jpg"
                    }
                ];
                saveUsers();
            }
        }

        // Save users to localStorage
        function saveUsers() {
            localStorage.setItem('tuition_users', JSON.stringify(users));
        }

        // Load jobs
        function loadJobs() {
            const saved = localStorage.getItem('tuition_jobs');
            if (saved) {
                tuitionJobs = JSON.parse(saved);
            } else {
                tuitionJobs = [
                    { id: 1, subject: "গণিত", class: "Class 9-10", area: "ধানমন্ডি", medium: "Bangla", salary: 8000, daysPerWeek: 5, hoursPerDay: 1.5, description: "অভিজ্ঞ গণিত শিক্ষক প্রয়োজন", studentName: "রহমান পরিবার", studentPhone: "01711223344", postedDate: "2024-01-15" },
                    { id: 2, subject: "ইংরেজি", class: "HSC", area: "গুলশান", medium: "English", salary: 10000, daysPerWeek: 4, hoursPerDay: 2, description: "এইচএসসি ইংরেজি টিউটর প্রয়োজন", studentName: "আহমেদ পরিবার", studentPhone: "01811223344", postedDate: "2024-01-14" }
                ];
                saveJobs();
            }
        }

        function saveJobs() {
            localStorage.setItem('tuition_jobs', JSON.stringify(tuitionJobs));
        }

        // Check login status
        function checkLoginStatus() {
            const saved = localStorage.getItem('currentUser');
            if (saved) {
                currentUser = JSON.parse(saved);
            }
        }

        // Save current user
        function saveCurrentUser(user) {
            localStorage.setItem('currentUser', JSON.stringify(user));
            currentUser = user;
        }

        // Clear current user
        function clearCurrentUser() {
            localStorage.removeItem('currentUser');
            currentUser = null;
        }

        // Show alert message
        function showAlert(message, type) {
            const alertDiv = document.getElementById('alertMessage');
            alertDiv.textContent = message;
            alertDiv.className = `alert alert-${type}`;
            alertDiv.style.display = 'block';
            setTimeout(() => {
                alertDiv.style.display = 'none';
            }, 3000);
        }

        // Open Auth Modal
        function openAuthModal() {
            document.getElementById('authModal').style.display = 'flex';
            switchAuthTab('login');
        }

        function closeAuthModal() {
            document.getElementById('authModal').style.display = 'none';
            // Clear forms
            document.getElementById('loginEmail').value = '';
            document.getElementById('loginPassword').value = '';
            document.getElementById('regName').value = '';
            document.getElementById('regEmail').value = '';
            document.getElementById('regPhone').value = '';
            document.getElementById('regPassword').value = '';
            document.getElementById('regConfirmPassword').value = '';
        }

        // Switch between login and register
        function switchAuthTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const tabs = document.querySelectorAll('.auth-tab');
            const title = document.getElementById('authTitle');
            
            if (tab === 'login') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                tabs[0].classList.add('active');
                tabs[1].classList.remove('active');
                title.textContent = 'Welcome Back!';
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                tabs[0].classList.remove('active');
                tabs[1].classList.add('active');
                title.textContent = 'Create New Account';
            }
        }

        // Login function
        function login() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                showAlert('Please enter email and password', 'error');
                return;
            }

            const user = users.find(u => u.email === email && u.password === password);
            
            if (user) {
                saveCurrentUser(user);
                closeAuthModal();
                renderProfile();
                showAlert(`Welcome back, ${user.name}!`, 'success');
            } else {
                showAlert('Invalid email or password', 'error');
            }
        }

        // Register function
        function register() {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const role = document.getElementById('regRole').value;
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;

            // Validation
            if (!name || !email || !phone || !password) {
                showAlert('Please fill all fields', 'error');
                return;
            }

            if (password !== confirmPassword) {
                showAlert('Passwords do not match', 'error');
                return;
            }

            if (password.length < 4) {
                showAlert('Password must be at least 4 characters', 'error');
                return;
            }

            // Check if email exists
            if (users.find(u => u.email === email)) {
                showAlert('Email already registered', 'error');
                return;
            }

            // Create new user
            const newUser = {
                id: Date.now(),
                name: name,
                email: email,
                phone: phone,
                password: password,
                role: role,
                profilePhoto: 'https://via.placeholder.com/150',
                area: '',
                rating: 0
            };

            if (role === 'tutor') {
                newUser.qualification = document.getElementById('regQualification').value || '';
                newUser.experience = document.getElementById('regExperience').value || '';
                newUser.subjects = [];
                newUser.classes = ['Class 9-10', 'HSC'];
            } else {
                newUser.class = document.getElementById('regClass').value;
                newUser.subjects = document.getElementById('regSubjects').value || '';
            }

            users.push(newUser);
            saveUsers();
            saveCurrentUser(newUser);
            closeAuthModal();
            renderProfile();
            showAlert('Account created successfully! Welcome to Tuition Media!', 'success');
        }

        // Render Profile
        function renderProfile() {
            const container = document.getElementById('profileContainer');
            
            if (!currentUser) {
                container.innerHTML = `
                    <div class="card login-required">
                        <i class="fas fa-lock" style="font-size: 60px; color: #667eea; margin-bottom: 20px;"></i>
                        <h2>Please Login First</h2>
                        <p style="margin: 10px 0; color: #666;">Login to view and manage your profile</p>
                        <div class="button-group" style="justify-content: center;">
                            <button class="btn btn-primary" onclick="openAuthModal()"><i class="fas fa-sign-in-alt"></i> Login</button>
                        </div>
                        <p style="margin-top: 20px; font-size: 12px; color: #999;">
                            Demo: tutor@example.com / 123456<br>
                            Admin: admin@tuition.com / admin123
                        </p>
                    </div>
                `;
                return;
            }

            if (currentUser.role === 'admin') {
                renderAdminProfile();
            } else if (currentUser.role === 'tutor') {
                renderTutorProfile();
            } else {
                renderStudentProfile();
            }
        }

        // Render Admin Profile
        function renderAdminProfile() {
            const container = document.getElementById('profileContainer');
            const tutorCount = users.filter(u => u.role === 'tutor').length;
            const studentCount = users.filter(u => u.role === 'student').length;
            
            container.innerHTML = `
                <div class="card">
                    <div class="profile-header">
                        <div class="profile-image-container">
                            <img src="${currentUser.profilePhoto || 'https://randomuser.me/api/portraits/men/99.jpg'}" class="profile-image" id="profileImage">
                            <button class="edit-photo-btn" onclick="openPhotoModal()"><i class="fas fa-camera"></i></button>
                        </div>
                        <div class="profile-name">${currentUser.name}</div>
                        <div class="profile-role"><i class="fas fa-shield-alt"></i> Administrator</div>
                    </div>
                    
                    <div class="info-grid">
                        <div class="info-row">
                            <span class="info-label"><i class="fas fa-envelope"></i> Email:</span>
                            <span class="info-value">${currentUser.email}</span>
                            <button class="info-edit-btn" onclick="openEditModal()"><i class="fas fa-edit"></i></button>
                        </div>
                        <div class="info-row">
                            <span class="info-label"><i class="fas fa-phone"></i> Phone:</span>
                            <span class="info-value">${currentUser.phone || 'Not provided'}</span>
                            <button class="info-edit-btn" onclick="openEditModal()"><i class="fas fa-edit"></i></button>
                        </div>
                        <div class="info-row">
                            <span class="info-label"><i class="fas fa-map-marker-alt"></i> Address:</span>
                            <span class="info-value">${currentUser.address || 'Not provided'}</span>
                            <button class="info-edit-btn" onclick="openEditModal()"><i class="fas fa-edit"></i></button>
                        </div>
                    </div>
                    
                    <div class="admin-panel">
                        <h3><i class="fas fa-chart-line"></i> Admin Dashboard</h3>
                        <p><i class="fas fa-users"></i> Total Users: ${users.length}</p>
                        <p><i class="fas fa-chalkboard-teacher"></i> Total Tutors: ${tutorCount}</p>
                        <p><i class="fas fa-user-graduate"></i> Total Students: ${studentCount}</p>
                        <p><i class="fas fa-briefcase"></i> Total Jobs: ${tuitionJobs.length}</p>
                    </div>
                    
                    <div class="button-group">
                        <button class="btn btn-danger" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
                    </div>
                </div>
            `;
        }

        // Render Tutor Profile
        function renderTutorProfile() {
            const container = document.getElementById('profileContainer');
            const subjects = currentUser.subjects || [];
            
            container.innerHTML = `
                <div class="card">
                    <div class="profile-header">
                        <div class="profile-image-container">
                            <img src="${currentUser.profilePhoto || 'https://via.placeholder.com/150'}" class="profile-image">
                            <button class="edit-photo-btn" onclick="openPhotoModal()"><i class="fas fa-camera"></i></button>
                        </div>
                        <div class="profile-name">${currentUser.name}</div>
                        <div class="profile-role"><i class="fas fa-chalkboard-teacher"></i> Professional Tutor</div>
                        <div class="rating">⭐ ${currentUser.rating || '4.5'} (${currentUser.experience || '0'} years experience)</div>
                    </div>
                    
                    <div class="info-grid">
                        <div class="info-row">
                            <span class="info-label"><i class="fas fa-envelope"></i> Email:</span>
                            <span class="info-value">${currentUser.email}</span>
                            <button class="info-edit-btn" onclick="openEditModal()"><i class="fas fa-edit"></i></button>
                        </div>
                        <div class="info-row">
                            <span class="info-label"><i class="fas fa-phone"></i> Phone:</span>
                            <span class="info-value">${currentUser.phone}</span>
                            <button class="info-edit-btn" onclick="openEditModal()"><i class="fas fa-edit"></i></button>
                        </div>
                        <div class="info-row">
                            <span class="info-label"><i class="fas fa-map-marker-alt"></i> Area:</span>
                            <span class="info-value">${currentUser.area || 'Not provided'}</span>
                            <button class="info-edit-btn" onclick="openEditModal()"><i class="fas fa-edit"></i></button>
                        </div>
                    </div>
                    
                    <div style="margin-top: 20px;">
                        <h3><i class="fas fa-certificate"></i> Qualification</h3>
                        <div style="padding: 15px; background: #f8f9fa; border-radius: 10px; margin-top: 10px; white-space: pre-line;">
                            ${currentUser.qualification || 'No qualification added yet'}
                        </div>
                        <button class="btn btn-outline" style="margin-top: 10px;" onclick="openEditModal()">
                            <i class="fas fa-edit"></i> Edit Qualification
                        </button>
                    </div>
                    
                    <div style="margin-top: 20px;">
                        <h3><i class="fas fa-book"></i> Teaching Subjects</h3>
                        <div class="subjects-container" id="subjectsContainer">
                            ${subjects.map(s => `
                                <span class="subject-tag">
                                    ${s}
                                    <button onclick="removeSubject('${s}')"><i class="fas fa-times"></i></button>
                                </span>
                            `).join('')}
                            <span class="subject-tag add-subject" onclick="openSubjectModal()">
                                <i class="fas fa-plus"></i> Add Subject
                            </span>
                        </div>
                    </div>
                    
                    <div class="button-group" style="margin-top: 20px;">
                        <button class="btn btn-danger" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
                    </div>
                </div>
            `;
        }

        // Render Student Profile
        function renderStudentProfile() {
            const container = document.getElementById('profileContainer');
            const myJobs = tuitionJobs.filter(job => job.studentName === currentUser.name);
            
            container.innerHTML = `
                <div class="card">
                    <div class="profile-header">
                        <div class="profile-image-container">
                            <img src="${currentUser.profilePhoto || 'https://via.placeholder.com/150'}" class="profile-image">
                            <button class="edit-photo-btn" onclick="openPhotoModal()"><i class="fas fa-camera"></i></button>
                        </div>
                        <div class="profile-name">${currentUser.name}</div>
                        <div class="profile-role"><i class="fas fa-user-graduate"></i> Student / Parent</div>
                    </div>
                    
                    <div class="info-grid">
                        <div class="info-row">
                            <span class="info-label"><i class="fas fa-envelope"></i> Email:</span>
                            <span class="info-value">${currentUser.email}</span>
                            <button class="info-edit-btn" onclick="openEditModal()"><i class="fas fa-edit"></i></button>
                        </div>
                        <div class="info-row">
                            <span class="info-label"><i class="fas fa-phone"></i> Phone:</span>
                            <span class="info-value">${currentUser.phone}</span>
                            <button class="info-edit-btn" onclick="openEditModal()"><i class="fas fa-edit"></i></button>
                        </div>
                        <div class="info-row">
                            <span class="info-label"><i class="fas fa-chalkboard"></i> Class:</span>
                            <span class="info-value">${currentUser.class || 'Not specified'}</span>
                            <button class="info-edit-btn" onclick="openEditModal()"><i class="fas fa-edit"></i></button>
                        </div>
                        <div class="info-row">
                            <span class="info-label"><i class="fas fa-book-open"></i> Subjects:</span>
                            <span class="info-value">${currentUser.subjects || 'Not specified'}</span>
                            <button class="info-edit-btn" onclick="openEditModal()"><i class="fas fa-edit"></i></button>
                        </div>
                    </div>
                    
                    <div style="margin-top: 20px;">
                        <h3><i class="fas fa-briefcase"></i> My Posted Jobs</h3>
                        ${myJobs.length > 0 ? myJobs.map(job => `
                            <div style="margin-top: 10px; padding: 15px; background: #f8f9fa; border-radius: 10px;">
                                <strong>${job.subject}</strong> - ${job.class}<br>
                                📍 ${job.area} | 💰 Tk ${job.salary}/month
                            </div>
                        `).join('') : '<p style="margin-top: 10px;">No jobs posted yet</p>'}
                    </div>
                    
                    <div class="button-group" style="margin-top: 20px;">
                        <button class="btn btn-danger" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
                    </div>
                </div>
            `;
        }

        // Open Edit Modal
        function openEditModal() {
            document.getElementById('editName').value = currentUser.name || '';
            document.getElementById('editPhone').value = currentUser.phone || '';
            document.getElementById('editEmail').value = currentUser.email || '';
            document.getElementById('editAddress').value = currentUser.area || currentUser.address || '';
            
            if (currentUser.role === 'student') {
                document.getElementById('editStudentFields').style.display = 'block';
                document.getElementById('editTutorFields').style.display = 'none';
                document.getElementById('editClass').value = currentUser.class || 'Class 1-5';
                document.getElementById('editSubjects').value = currentUser.subjects || '';
            } else if (currentUser.role === 'tutor') {
                document.getElementById('editStudentFields').style.display = 'none';
                document.getElementById('editTutorFields').style.display = 'block';
                document.getElementById('editQualification').value = currentUser.qualification || '';
                document.getElementById('editExperience').value = currentUser.experience || '';
            } else {
                document.getElementById('editStudentFields').style.display = 'none';
                document.getElementById('editTutorFields').style.display = 'none';
            }
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        // Save profile changes
        document.getElementById('editForm')?.addEventListener('submit', function(e) {
            e.preventDefault();
            
            currentUser.name = document.getElementById('editName').value;
            currentUser.phone = document.getElementById('editPhone').value;
            currentUser.email = document.getElementById('editEmail').value;
            currentUser.area = document.getElementById('editAddress').value;
            
            if (currentUser.role === 'student') {
                currentUser.class = document.getElementById('editClass').value;
                currentUser.subjects = document.getElementById('editSubjects').value;
            } else if (currentUser.role === 'tutor') {
                currentUser.qualification = document.getElementById('editQualification').value;
                currentUser.experience = document.getElementById('editExperience').value;
            }
            
            // Update in users array
            const index = users.findIndex(u => u.id === currentUser.id);
            if (index !== -1) {
                users[index] = currentUser;
                saveUsers();
            }
            
            saveCurrentUser(currentUser);
            closeEditModal();
            renderProfile();
            showAlert('Profile updated successfully!', 'success');
        });

        // Photo functions
        function openPhotoModal() {
            document.getElementById('photoModal').style.display = 'flex';
        }

        function closePhotoModal() {
            document.getElementById('photoModal').style.display = 'none';
            document.getElementById('photoUrl').value = '';
        }

        function setPhoto(url) {
            document.getElementById('photoUrl').value = url;
        }

        function updatePhoto() {
            const url = document.getElementById('photoUrl').value;
            if (url) {
                currentUser.profilePhoto = url;
                
                // Update in users array
                const index = users.findIndex(u => u.id === currentUser.id);
                if (index !== -1) {
                    users[index] = currentUser;
                    saveUsers();
                }
                
                saveCurrentUser(currentUser);
                closePhotoModal();
                renderProfile();
                showAlert('Profile photo updated!', 'success');
            } else {
                showAlert('Please enter a photo URL', 'error');
            }
        }

        // Subject functions for tutors
        function openSubjectModal() {
            document.getElementById('subjectModal').style.display = 'flex';
        }

        function closeSubjectModal() {
            document.getElementById('subjectModal').style.display = 'none';
            document.getElementById('newSubject').value = '';
        }

        function addNewSubject() {
            const subject = document.getElementById('newSubject').value.trim();
            if (subject && currentUser.role === 'tutor') {
                if (!currentUser.subjects) currentUser.subjects = [];
                if (!currentUser.subjects.includes(subject)) {
                    currentUser.subjects.push(subject);
                    
                    // Update in users array
                    const index = users.findIndex(u => u.id === currentUser.id);
                    if (index !== -1) {
                        users[index] = currentUser;
                        saveUsers();
                    }
                    
                    saveCurrentUser(currentUser);
                    closeSubjectModal();
                    renderProfile();
                    showAlert(`Subject "${subject}" added!`, 'success');
                } else {
                    showAlert('Subject already exists', 'error');
                }
            } else {
                showAlert('Please enter a subject name', 'error');
            }
        }

        function removeSubject(subject) {
            if (currentUser.role === 'tutor' && currentUser.subjects) {
                currentUser.subjects = currentUser.subjects.filter(s => s !== subject);
                
                // Update in users array
                const index = users.findIndex(u => u.id === currentUser.id);
                if (index !== -1) {
                    users[index] = currentUser;
                    saveUsers();
                }
                
                saveCurrentUser(currentUser);
                renderProfile();
                showAlert(`Subject "${subject}" removed`, 'success');
            }
        }

        // Logout
        function logout() {
            clearCurrentUser();
            renderProfile();
            showAlert('Logged out successfully!', 'success');
        }

        // Close modals on outside click
        window.onclick = function(event) {
            const modals = document.querySelectorAll('.modal');
            modals.forEach(modal => {
                if (event.target === modal) {
                    modal.style.display = 'none';
                }
            });
        }

        // Initialize
        init();
    </script>
</body>
</html>
